<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ table_name }} Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles/main.css" />
    <link rel="stylesheet" type="text/css" href="/static/styles/entities.css" />
  </head>
  <body>
    <h2 class="sub-title">{{ table_name }}</h2>
    <div class="label">
      <input type="hidden" id="id" />
      <div class="input-group text mb-3">
        <span class="input-group-text" id="basic-addon1">Пацієнт</span>
        <input
          id="user"
          type="text"
          class="form-control"
          placeholder="Пацієнт"
          aria-label="User"
          aria-describedby="basic-addon1"
        />
      </div>
      <div class="invalid-feedback">Пацієнта не знайдено</div>

      <div class="input-group text mb-3">
        <span class="input-group-text" id="basic-addon1">Лікар</span>
        <input
          id="doctor"
          type="text"
          class="form-control"
          placeholder="Лікар"
          aria-label="Doctor"
          aria-describedby="basic-addon1"
        />
      </div>
      <div class="invalid-feedback">Лікаря не знайдено</div>

      <div class="text input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping">Дата та час:</span>
        <input
          id="date_time"
          type="datetime-local"
          class="form-control"
          placeholder="Username"
          aria-label="Username"
          aria-describedby="addon-wrapping"
        />
      </div>

      <div class="text buttons">
        <button id="saveBtn" class="btn btn-outline-success">Зберегти</button>
        <button id="resetBtn" class="btn btn-outline-secondary">Скинути</button>
      </div>
    </div>
    <div class="table-container">
      <table class="table table-sm table-hover table-striped">
        <thead>
          <tr>
            <th>Пацієнт</th>
            <th>Лікар</th>
            <th>Дата та час</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <a href="/" class="btn btn-outline-secondary small-text m-3">Назад</a>
    <script>
      async function getAppointments() {
        const response = await fetch("/appointments/", {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.ok === true) {
          const appointments = await response.json();
          const rows = document.querySelector("tbody");
          appointments.forEach((appointment) => rows.append(row(appointment)));
        }
      }

      async function getAppointment(id) {
        const response = await fetch(`/appointments/${id}`, {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.ok === true) {
          const appointment = await response.json();
          document.getElementById("id").value = appointment.id;
          document.getElementById("user").value = appointment.user;
          document.getElementById("doctor").value = appointment.doctor;
          document.getElementById("date_time").value = appointment.date_time;
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      function highlightError(inputId, show = true) {
        const input = document.getElementById(inputId);
        if (show) {
          input.classList.add("is-invalid");
        } else {
          input.classList.remove("is-invalid");
        }
      }

      async function createAppointment(user, doctor, date_time) {
        const response = await fetch("/appointments/", {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user: user,
            doctor: doctor,
            date_time: date_time,
          }),
        });
        highlightError("user", false);
        highlightError("doctor", false);
        if (response.ok === true) {
          const appointment = await response.json();
          document.querySelector("tbody").append(row(appointment));
          document.getElementById("id").value = appointment.id;
        } else {
          const error = await response.json();
          console.log(error.message);
          if (error.error.includes("user")) {
            highlightError("user", true);
          }
          if (error.error.includes("doctor")) {
            highlightError("doctor", true);
          }
        }
      }

      async function editAppointment(id, user, doctor, date_time) {
        const response = await fetch(`/appointments/${id}`, {
          method: "PUT",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user: user,
            doctor: doctor,
            date_time: date_time,
          }),
        });
        highlightError("user", false);
        highlightError("doctor", false);
        if (response.ok === true) {
          const appointment = await response.json();
          document
            .querySelector(`tr[data-rowid='${appointment.id}']`)
            .replaceWith(row(appointment));
        } else {
          const error = await response.json();
          console.log(error.message);

          if (error.error.includes("user")) {
            highlightError("user", true);
          }
          if (error.error.includes("doctor")) {
            highlightError("doctor", true);
          }
        }
      }

      async function deleteAppointment(id) {
        const response = await fetch(`/appointments/${id}`, {
          method: "DELETE",
          headers: { Accept: "application/json" },
        });
        if (response.ok === true) {
          const appointment = await response.json();
          document.querySelector(`tr[data-rowid='${appointment.id}']`).remove();
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      function reset() {
        document.getElementById("id").value =
          document.getElementById("user").value =
          document.getElementById("doctor").value =
          document.getElementById("date_time").value =
            "";
      }

      function row(appointment) {
        const tr = document.createElement("tr");
        tr.setAttribute("data-rowid", appointment.id);
        const userTd = document.createElement("td");
        userTd.append(appointment.user);
        tr.append(userTd);
        const doctorTd = document.createElement("td");
        doctorTd.append(appointment.doctor);
        tr.append(doctorTd);
        const date_timeTd = document.createElement("td");
        date_timeTd.append(appointment.date_time);
        tr.append(date_timeTd);
        const linksTd = document.createElement("td");
        const editLink = document.createElement("button");
        editLink.append("Змінити");
        editLink.className = "table-buttons btn btn-outline-secondary";
        editLink.addEventListener(
          "click",
          async () => await getAppointment(appointment.id)
        );
        linksTd.append(editLink);
        const removeLink = document.createElement("button");
        removeLink.append("Видалити");
        removeLink.className = "table-buttons btn btn-outline-danger";
        removeLink.addEventListener(
          "click",
          async () => await deleteAppointment(appointment.id)
        );
        linksTd.append(removeLink);
        tr.appendChild(linksTd);
        return tr;
      }

      document
        .getElementById("resetBtn")
        .addEventListener("click", () => reset());

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const id = document.getElementById("id").value;
        const user = document.getElementById("user").value;
        const doctor = document.getElementById("doctor").value;
        const date_time = document.getElementById("date_time").value;
        if (id === "") await createAppointment(user, doctor, date_time);
        else await editAppointment(id, user, doctor, date_time);
        reset();
      });

      getAppointments();
    </script>
  </body>
</html>
