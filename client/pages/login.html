<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Вхід</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles/main.css" />
    <link rel="stylesheet" type="text/css" href="/static/styles/sing_in.css" />
  </head>
  <body>
    <header>{% include 'navbar.html' %}</header>
    <div class="container mt-5">
      <h2>Вхід до системи</h2>
      <form method="post" id="loginForm">
        {% csrf_token %}
        <div class="input-group text label">
          <span class="input-group-text">Ім'я</span>
          <input
            id="name"
            type="text"
            aria-label="Name"
            placeholder="Ім'я"
            class="form-control"
            name="name"
            required
          />
        </div>
        <div class="input-group label text">
          <span class="input-group-text">Пароль</span>
          <input
            id="password"
            type="password"
            aria-label="Password"
            placeholder="Пароль"
            class="form-control"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Увійти</button>
        <p>Немає акаунта? <a href="/register/">Register</a></p>
      </form>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("name").value;
          const password = document.getElementById("password").value;

          const response = await fetch("/login/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, password }),
          });

          const data = await response.json();
          if (data.redirect_url) {
            window.location.href = data.redirect_url;
          } else {
            alert(data.error || "Login failed");
          }
        });
    </script>
  </body>
</html>
