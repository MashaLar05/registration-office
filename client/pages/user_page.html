<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профіль користувача</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles/main.css" />
  </head>
  <body>
    <header>{% include 'navbar.html' %}</header>
    <div class="container mt-5">
      <h2>Редагування профілю</h2>
      <form id="profileForm" method="post" class="m-3">
        {% csrf_token %}
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}" />
        <div class="mb-3">
          <label for="name" class="form-label">Ім'я:</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            value="{{ user.name }}"
            required
          />
        </div>
        <div class="mb-3">
          <label for="last_name" class="form-label">Прізвище:</label>
          <input
            type="text"
            id="last_name"
            name="last_name"
            class="form-control"
            value="{{ user.last_name }}"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label"
            >Новий пароль (залиште порожнім, щоб не змінювати):</label
          >
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
          />
        </div>
        <div class="mb-3">
          <label for="date_of_birth" class="form-label">Дата народження:</label>
          <input
            type="date"
            id="date_of_birth"
            name="date_of_birth"
            class="form-control"
            value="{{ user.date_of_birth|date:'Y-m-d' }}"
          />
        </div>
        <button type="submit" class="btn btn-primary">Зберегти</button>
      </form>
    </div>
    <script>
      console.log("Profile form script loaded"); // Відладка
      function getCookie(name) {
        console.log("Cookies:", document.cookie); // Відладка
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1)
              );
              console.log("Found CSRF token:", cookieValue); // Відладка
              break;
            }
          }
        }
        return cookieValue;
      }

      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          console.log("Form submitted"); // Відладка
          const name = document.getElementById("name").value;
          const last_name = document.getElementById("last_name").value;
          const password = document.getElementById("password").value;
          const date_of_birth = document.getElementById("date_of_birth").value;
          const csrfToken =
            getCookie("csrftoken") ||
            document.getElementById("csrf_token").value;

          console.log("CSRF Token:", csrfToken); // Відладка
          console.log("Sending data:", {
            name,
            last_name,
            password,
            date_of_birth,
          }); // Відладка

          try {
            const response = await fetch("/user_page/{{ user.id }}/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
              },
              body: JSON.stringify({
                name,
                last_name,
                password,
                date_of_birth,
              }),
            });

            const data = await response.json();
            console.log("Response:", data); // Відладка
            if (response.ok && data.redirect_url) {
              window.location.href = data.redirect_url;
            } else {
              alert(data.error || "Не вдалося оновити профіль");
            }
          } catch (error) {
            console.error("Fetch error:", error); // Відладка
            alert("Помилка під час оновлення профілю");
          }
        });
    </script>
  </body>
</html>
