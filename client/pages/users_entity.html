<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ table_name }} Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/static/styles/main.css" />
    <link rel="stylesheet" type="text/css" href="/static/styles/entities.css" />
  </head>
  <body>
    <h2 class="sub-title">{{ table_name }}</h2>
    <div class="label">
      <input type="hidden" id="id" />
      <div class="input-group text name-last_name">
        <span class="input-group-text">Ім'я та прізвище</span>
        <input
          id="name"
          type="text"
          aria-label="First name"
          placeholder="Ім'я"
          class="form-control"
        />
        <input
          id="last_name"
          type="text"
          aria-label="Last name"
          placeholder="Прізвище"
          class="form-control"
        />
      </div>

      <div class="input-group text">
        <span class="input-group-text">Пароль</span>
        <input
          id="password"
          type="password"
          aria-label="Password"
          placeholder="Пароль"
          class="form-control"
          name="password"
          required
        />
      </div>

      <div class="text">
        <select
          id="role"
          class="form-select"
          aria-label="Default select example"
        >
          <option selected>Роль</option>
          <option value="admin">Адміністратор</option>
          <option value="user">Користувач</option>
        </select>
      </div>

      <div class="text input-group flex-nowrap">
        <span class="input-group-text" id="addon-wrapping"
          >Дата народження:</span
        >
        <input
          id="date_of_birth"
          type="datetime-local"
          class="form-control"
          placeholder="Username"
          aria-label="Username"
          aria-describedby="addon-wrapping"
        />
      </div>

      <div class="text buttons">
        <button id="saveBtn" class="btn btn-outline-success">Зберегти</button>
        <button id="resetBtn" class="btn btn-outline-secondary">Скинути</button>
      </div>
    </div>
    <div class="table-container">
      <table class="table table-sm table-hover table-striped">
        <thead>
          <tr>
            <th>Ім'я</th>
            <th>Прізвище</th>
            <th>Роль</th>
            <th>Дата народження</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <a href="/" class="btn btn-outline-secondary small-text m-3">Назад</a>
    <script>
      async function getUsers() {
        const response = await fetch("/users/", {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.ok) {
          const users = await response.json();
          const rows = document.querySelector("tbody");
          users.forEach((user) => rows.append(row(user)));
        }
      }

      async function getUser(id) {
        const response = await fetch(`/users/${id}`, {
          method: "GET",
          headers: { Accept: "application/json" },
        });
        if (response.ok) {
          const user = await response.json();
          document.getElementById("id").value = user.id;
          document.getElementById("name").value = user.name;
          document.getElementById("last_name").value = user.last_name;
          document.getElementById("role").value = user.role;
          document.getElementById("date_of_birth").value = user.date_of_birth;
          document.getElementById("password").value = ""; // Password not returned
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      async function createUser(
        name,
        last_name,
        role,
        password,
        date_of_birth
      ) {
        if (role !== "user" && role !== "admin") {
          alert("Неприпустима роль. Має бути або 'user', або 'admin'.");
          return;
        }
        const response = await fetch("/users/", {
          method: "POST",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            name,
            last_name,
            role,
            password,
            date_of_birth,
          }),
        });
        if (response.ok) {
          const user = await response.json();
          document.querySelector("tbody").append(row(user));
          document.getElementById("id").value = user.id;
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      async function editUser(
        id,
        name,
        last_name,
        role,
        password,
        date_of_birth
      ) {
        if (role !== "user" && role !== "admin") {
          alert("Неприпустима роль. Має бути або 'user', або 'admin'.");
          return;
        }
        const body = {
          name,
          last_name,
          role,
          date_of_birth,
        };
        if (password) {
          body.password = password; // Only include password if provided
        }
        const response = await fetch(`/users/${id}`, {
          method: "PUT",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });
        if (response.ok) {
          const user = await response.json();
          document
            .querySelector(`tr[data-rowid='${user.id}']`)
            .replaceWith(row(user));
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      async function deleteUser(id) {
        const response = await fetch(`/users/${id}`, {
          method: "DELETE",
          headers: { Accept: "application/json" },
        });
        if (response.ok) {
          const user = await response.json();
          document.querySelector(`tr[data-rowid='${user.id}']`).remove();
        } else {
          const error = await response.json();
          console.log(error.message);
        }
      }

      function reset() {
        document.getElementById("id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("last_name").value = "";
        document.getElementById("role").value = "";
        document.getElementById("date_of_birth").value = "";
        document.getElementById("password").value = "";
      }

      function row(user) {
        const tr = document.createElement("tr");
        tr.setAttribute("data-rowid", user.id);
        const nameTd = document.createElement("td");
        nameTd.append(user.name);
        tr.append(nameTd);
        const lastNameTd = document.createElement("td");
        lastNameTd.append(user.last_name);
        tr.append(lastNameTd);
        const roleTd = document.createElement("td");
        roleTd.append(user.role);
        tr.append(roleTd);
        const dateOfBirthTd = document.createElement("td");
        dateOfBirthTd.append(user.date_of_birth);
        tr.append(dateOfBirthTd);
        const linksTd = document.createElement("td");
        const editLink = document.createElement("button");
        editLink.append("Змінити");
        editLink.className = "table-buttons btn btn-outline-secondary";
        editLink.addEventListener("click", async () => await getUser(user.id));
        linksTd.append(editLink);
        const removeLink = document.createElement("button");
        removeLink.append("Видалити");
        removeLink.className = "table-buttons btn btn-outline-danger";
        removeLink.addEventListener(
          "click",
          async () => await deleteUser(user.id)
        );
        linksTd.append(removeLink);
        tr.appendChild(linksTd);
        return tr;
      }

      document
        .getElementById("resetBtn")
        .addEventListener("click", () => reset());

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const id = document.getElementById("id").value;
        const name = document.getElementById("name").value;
        const last_name = document.getElementById("last_name").value;
        const role = document.getElementById("role").value;
        const password = document.getElementById("password").value;
        const date_of_birth = document.getElementById("date_of_birth").value;
        if (id === "") {
          await createUser(name, last_name, role, password, date_of_birth);
        } else {
          await editUser(id, name, last_name, role, password, date_of_birth);
        }
        reset();
      });

      getUsers();
    </script>
  </body>
</html>
